name: fosnie-routing-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: routing_test
      POSTGRES_PASSWORD: routing_test_only
      POSTGRES_DB: routing_test
    ports:
      - "127.0.0.1:15439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routing_test -d routing_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16389:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
