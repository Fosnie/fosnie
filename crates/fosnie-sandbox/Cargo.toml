[package]
name = "fosnie-sandbox"
version = "0.1.0"
edition = "2021"
description = "The operating-system boundary a desktop-agent command runs inside, per platform."
license = "Apache-2.0"
publish = false

[lib]
name = "fosnie_sandbox"
path = "src/lib.rs"

# Deliberately free of the desktop application's user-interface stack, so the
# boundary can be built and tested on its own, on the operating system it targets.
[dependencies]
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "time"] }

# The process tree is managed by a job object, so a command that starts other
# programs is stopped together with them.
[target.'cfg(windows)'.dependencies]
win32job = "2"

# The filesystem-and-network boundary is bubblewrap (a separate binary, invoked),
# with a seccomp filter compiled and handed to it for the syscall classes a
# namespace does not cover.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
